<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Nori bed: cozy cheer star plush  rest so we can rally tomorrow -->
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="55%" stop-color="#ffd60a"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fab" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff8fab" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft shadow -->
  <ellipse cx="60" cy="88" rx="38" ry="6" fill="#000" opacity="0.1"/>

  <!-- star body -->
  <polygon
    points="60,8 70,38 102,38 76,58 86,90 60,70 34,90 44,58 18,38 50,38"
    fill="url(#starGlow)"
    stroke="#e85d04"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- sleepy face -->
  <g transform="translate(60,48)">
    <!-- closed eyes (happy crescents) -->
    <path d="M-16,-2 Q-12,-8 -8,-2" fill="none" stroke="#5c3d2e" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M8,-2 Q12,-8 16,-2" fill="none" stroke="#5c3d2e" stroke-width="2.2" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="-18" cy="6" r="5" fill="url(#cheek)"/>
    <circle cx="18" cy="6" r="5" fill="url(#cheek)"/>
    <!-- smile -->
    <path d="M-6,8 Q0,14 6,8" fill="none" stroke="#5c3d2e" stroke-width="2" stroke-linecap="round"/>
    <!-- tiny Zzz -->
    <text x="22" y="-14" font-family="Verdana, Geneva, sans-serif" font-size="9" font-weight="700" fill="#90e0ef">z</text>
    <text x="28" y="-22" font-family="Verdana, Geneva, sans-serif" font-size="7" font-weight="700" fill="#48cae4">z</text>
    <text x="33" y="-28" font-family="Verdana, Geneva, sans-serif" font-size="5" font-weight="700" fill="#00b4d8">z</text>
  </g>

  <!-- mini pom accents tucked at base -->
  <circle cx="28" cy="82" r="7" fill="#ff4d6d"/>
  <circle cx="24" cy="78" r="4" fill="#ff758f"/>
  <circle cx="92" cy="82" r="7" fill="#00b4d8"/>
  <circle cx="96" cy="78" r="4" fill="#48cae4"/>

  <!-- banner ribbon -->
  <path d="M22,96 L38,90 L82,90 L98,96 L82,94 L38,94 Z" fill="#ef476f"/>
  <text x="60" y="96.5" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="6" font-weight="700" fill="#fff">TEAMWORK </text>
</svg>
